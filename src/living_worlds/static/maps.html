<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth maps</title>
<style>
  /* Three zones (Dan, 2026-10-31: "more cohesive as a unit of view"): the map,
     clean; one instrument card at its top left (this page's picker on top, the
     map's own description, layers, notes and credits joined beneath it); and
     the chat beside it. The glass follows the theme: warm black by night,
     cream by day. */
  :root {
    --night: #15120f; --cream: #f7f4ef; --dim: rgba(247,244,239,.62); --signal: #E84A2F; --signal-hi: #E84A2F;
    --glass: rgba(21,18,15,.5); --glass-hi: rgba(21,18,15,.82); --edge: rgba(255,255,255,.13);
    --cond: "Roboto Condensed", Bahnschrift, "Arial Narrow", system-ui, sans-serif;
    --mono: "Roboto Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
    --card-w: min(380px, calc(100vw - 20px));
  }
  body.light { --glass: rgba(244,239,231,.72); --glass-hi: rgba(244,239,231,.92); --edge: rgba(255,255,255,.75); --cream: #2a2521; --dim: rgba(42,37,33,.58); --signal-hi: #E84A2F; }
  body.light .thumb { background: linear-gradient(140deg, #efe9e0, #ddd4c7); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--cream); font: 14px/1.3 var(--cond); }
  * { scrollbar-width: thin; scrollbar-color: rgba(232,74,47,.6) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(232,74,47,.5); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  .stage { position: fixed; inset: 0; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--night);
    opacity: 0; transition: opacity .45s ease; }
  .stage iframe.on { opacity: 1; }

  .glass { background: var(--glass); -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6);
    box-shadow: 0 10px 30px rgba(0,0,0,.28), inset 0 0 0 1px var(--edge); }

  /* the card's top row: what is showing, the one before and after, the theme, the fold */
  .picker { position: fixed; top: 10px; left: 10px; width: var(--card-w); z-index: 10;
    display: flex; align-items: stretch; border-radius: 16px; }
  body.joined:not(.folded) .picker { border-radius: 16px 16px 0 0; box-shadow: inset 0 0 0 1px var(--edge); }
  .picker button { background: none; border: 0; color: var(--cream); font: inherit; cursor: pointer; }
  .icon { width: 34px; flex: none; display: grid; place-items: center; color: var(--dim) !important; }
  .icon:hover:not(:disabled) { color: var(--cream) !important; background: rgba(127,127,127,.12); }
  .icon:disabled { opacity: .25; cursor: default; }
  .icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  #prev { border-radius: 16px 0 0 0; }
  body.folded #prev, body:not(.joined) #prev { border-radius: 16px 0 0 16px; }
  #fold { border-radius: 0 16px 0 0; border-left: 1px solid var(--edge) !important; }
  body.folded #fold, body:not(.joined) #fold { border-radius: 0 16px 16px 0; }
  body.folded #fold svg { transform: rotate(180deg); }
  .now { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 8px 6px !important; text-align: left; }
  .now:hover, body.open .now { background: rgba(127,127,127,.1) !important; }
  .now .words { min-width: 0; flex: 1; }
  /* long names: fade at rest, glide once on hover and wait, as the music player does */
  .now .t { text-overflow: clip; }
  .t .run { display: inline-block; transition: transform var(--run-s, 0s) linear; }
  .t.long:not(.running) { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
  .t.running .run { transform: translateX(var(--run-d, 0)); transition-delay: .25s; }
  .t { display: block; font: 600 15px/1.15 var(--cond); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { display: block; margin-top: 4px; font: 500 9.5px/1 var(--mono); letter-spacing: .15em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta b { color: var(--signal-hi); font-weight: 600; }
  .meta b, .meta { text-shadow: 0 0 2px rgba(0,0,0,.55), 0 0 8px rgba(0,0,0,.4), 0 0 14px rgba(232,74,47,.35); }
  .chev { width: 13px; height: 13px; flex: none; fill: none; stroke: var(--dim); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s; }
  body.open .chev { transform: rotate(180deg); }

  .thumb { width: 50px; height: 34px; flex: none; border-radius: 8px; overflow: hidden; position: relative;
    background: linear-gradient(140deg, #2b2620, #1a1612); box-shadow: inset 0 0 0 1px var(--edge); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb svg { position: absolute; inset: 0; margin: auto; width: 55%; height: 55%; fill: none; stroke: var(--signal-hi); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* every map, as a list that opens from the card */
  .list { position: fixed; top: var(--card-bottom, 64px); left: 10px; z-index: 11; width: var(--card-w);
    max-height: calc(100% - var(--card-bottom, 64px) - 20px); overflow-y: auto; border-radius: 0 0 16px 16px; padding: 6px;
    display: flex; flex-direction: column; gap: 2px; background: var(--glass-hi);
    opacity: 0; pointer-events: none; transform: translateY(-6px); transition: opacity .2s ease, transform .2s ease; }
  body.open .list { opacity: 1; pointer-events: auto; transform: none; }
  .row { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border: 0; border-radius: 10px; background: none; color: var(--cream); font: inherit; text-align: left; cursor: pointer; }
  .row:hover { background: rgba(127,127,127,.12); }
  .row.cur { background: rgba(232,74,47,.18); }
  .row .thumb { width: 64px; height: 42px; }
  .row .words { min-width: 0; }

  body.docked .picker, body.docked .list, body.pending .picker { display: none !important; }
  .empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); font: 15px var(--cond); text-align: center; }
  @media (prefers-reduced-motion: reduce) { .stage iframe, .list, .chev { transition: none; } }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="picker glass" id="picker" hidden>
  <button class="icon" id="prev" title="Newer map (←)" aria-label="Newer map"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="now" id="now" title="All maps (G)" aria-haspopup="true">
    <span class="thumb" id="nowthumb"></span>
    <span class="words"><span class="t" id="nowtitle"></span><span class="meta" id="nowmeta"></span></span>
    <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <button class="icon" id="next" title="Older map (→)" aria-label="Older map"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="icon" id="theme" title="Light or dark (T)"></button>
  <button class="icon" id="fold" title="Fold the card (F)" aria-label="Fold the card"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
</div>
<div class="list glass" id="list" role="menu"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  let theme = localStorage.getItem('earth-maps.theme') === 'light' ? 'light' : 'dark';
  let folded = localStorage.getItem('earth-maps.folded') === '1';
  const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  function paintTheme() {
    document.body.classList.toggle('light', theme === 'light');
    $('theme').innerHTML = theme === 'light' ? MOON : SUN;
    $('theme').setAttribute('aria-label', theme === 'light' ? 'Switch to dark' : 'Switch to light');
  }
  function setTheme(t) { theme = t; localStorage.setItem('earth-maps.theme', t); paintTheme(); tellParent(); tellTheme(); if (current) { const c = current; current = null; show(c); } }
  function setFold(on) {
    folded = !!on; localStorage.setItem('earth-maps.folded', folded ? '1' : '0');
    document.body.classList.toggle('folded', folded);
    $('fold').setAttribute('aria-label', folded ? 'Open the card' : 'Fold the card');
    if (frame) arrange(frame);
    tellParent();
  }

  // The dashboard's chat may lie over this page's right side (it says how far),
  // or float in the lower right in full screen; the map's right-hand controls
  // stay clear of it.
  let inset = 0, insetTop = 0, float = null;
  // Inside the dashboard (Dan, 2026-10-31): the switcher is part of one ribbon
  // across the top of the map, with the tool's name, full screen, its own tab
  // and close. The dashboard says hello; this page hands over its maps and
  // actions, hides its own picker, and starts its card below the ribbon.
  let docked = false, parentOrigin = null, told = '';
  const whereOf = {};
  if (window.parent !== window) {
    document.body.classList.add('pending');
    setTimeout(() => document.body.classList.remove('pending'), 1500);
  }
  function tellTheme() {
    if (docked && parentOrigin) window.parent.postMessage({ type: 'astrolabe:tool-theme', theme }, parentOrigin);
  }
  function tellParent() {
    if (!docked || !parentOrigin) return;
    const msg = {
      type: 'astrolabe:tool-nav', current,
      items: maps.map((m, i) => ({ id: m.file, title: m.title, meta: m.kind + ' · ' + ago(m.mtime) + ' · ' + (i + 1) + ' of ' + maps.length, thumb: m.thumb ? location.origin + '/maps/' + m.thumb : null })),
      actions: [
        // make this map a living world: beside its name, on any map that knows where it is
        ...(whereOf[current] && !/^(img\/)?(world-|field-test)/.test(current) ? [{ id: 'world', label: 'Make it a living world', icon: 'tree', beside: true }] : []),
        { id: 'theme', label: theme === 'light' ? 'Switch to dark' : 'Switch to light', icon: theme === 'light' ? 'moon' : 'sun' },
        { id: 'fold', label: folded ? 'Open the card' : 'Fold the card', icon: folded ? 'unfold' : 'fold' },
      ],
    };
    // only when something changed, so an open list is not redrawn shut
    const said = JSON.stringify(msg);
    if (said === told) return;
    told = said;
    window.parent.postMessage(msg, parentOrigin);
  }
  window.addEventListener('message', (e) => {
    if (e.source !== window.parent || !e.data || typeof e.data.type !== 'string') return;
    if (e.data.type === 'astrolabe:tool-nav-hello') {
      docked = true; parentOrigin = e.origin; told = '';
      document.body.classList.add('docked'); document.body.classList.remove('pending');
      if (frame) arrange(frame);
      tellParent();
      tellTheme();
    } else if (e.data.type === 'astrolabe:tool-nav-go' && typeof e.data.id === 'string') show(e.data.id);
    else if (e.data.type === 'astrolabe:tool-nav-action' && e.data.id === 'theme') setTheme(theme === 'light' ? 'dark' : 'light');
    else if (e.data.type === 'astrolabe:tool-nav-action' && e.data.id === 'fold') setFold(!folded);
    else if (e.data.type === 'astrolabe:tool-nav-action' && e.data.id === 'world' && whereOf[current]) {
      const m = maps.find((x) => x.file === current), [lon, lat] = whereOf[current];
      window.parent.postMessage({ type: 'astrolabe:ask', text: 'Make a living world of ' + (m ? m.title : 'this map') + ' at ' + lon.toFixed(5) + ',' + lat.toFixed(5) + ': study the place first (its trees, what grows under them, its wildlife, its structures), then build it.' }, parentOrigin || '*');
    }
  });
  window.addEventListener('message', (e) => {
    if (e.source !== window.parent || !e.data || e.data.type !== 'astrolabe:tool-inset') return;
    inset = Math.max(0, Math.min(window.innerWidth - 200, Number(e.data.right) || 0));
    insetTop = Math.max(0, Math.min(window.innerHeight - 100, Number(e.data.top) || 0));
    const fl = e.data.float;
    float = fl && Number.isFinite(fl.right) ? { right: Math.max(0, Math.min(window.innerWidth - 200, fl.right)) } : null;
    for (const fr of document.querySelectorAll('.stage iframe')) arrange(fr);
    reflow();
  });

  // Joins the map's own panel to the card: it sits flush under the top row,
  // its notes, Stack and credits gathered into it, the stack opening as a
  // panel below the card, and the before and after dates on the divider.
  function arrange(fr) {
    try {
      const d = fr.contentDocument;
      if (!d || !d.body) return;
      const root = d.documentElement, pr = $('picker').getBoundingClientRect();
      const cardTop = docked ? insetTop + 8 : pr.bottom;
      const cardW = docked ? Math.min(380, window.innerWidth - 20) : pr.width;
      document.documentElement.style.setProperty('--card-bottom', Math.round(pr.bottom) + 'px');
      root.style.setProperty('--em-card-top', Math.round(cardTop) + 'px');
      root.style.setProperty('--em-card-w', Math.round(cardW) + 'px');
      d.body.classList.toggle('em-folded', folded);
      // a link to one of these maps (the field test's "open the live artifact")
      // opens it right here, in this viewer, rather than in a new tab
      if (!d.body.dataset.emLinks) {
        d.body.dataset.emLinks = '1';
        d.addEventListener('click', (e) => {
          const a = e.target.closest && e.target.closest('a[href]');
          if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
          let u;
          try { u = new URL(a.getAttribute('href'), d.baseURI); } catch (_) { return; }
          if (u.origin !== location.origin || !u.pathname.startsWith('/maps/')) return;
          const file = decodeURIComponent(u.pathname.slice('/maps/'.length));
          if (!maps.some((m) => m.file === file)) return;
          e.preventDefault();
          show(file);
        }, true);
      }
      // a 3D map gets a sky and a haze that thickens with distance, so the
      // far edge fades into air rather than ending on the flat street map
      // (2026-10-31, a first taste of the game-engine look)
      if (/\/map3d-/.test(fr.src)) {
        const sky = theme === 'light'
          ? { 'sky-color': '#9fc3e6', 'horizon-color': '#f3e3cf', 'fog-color': '#ead9c4' }
          : { 'sky-color': '#2a3550', 'horizon-color': '#8a6a58', 'fog-color': '#5b4a42' };
        try {
          fr.contentWindow.eval('(function(s){ if (typeof map === "undefined" || !map.setSky) return;'
            + ' const go = function(){ map.setSky(Object.assign({ "sky-horizon-blend": 0.6, "horizon-fog-blend": 0.7, "fog-ground-blend": 0.35, "atmosphere-blend": 0.8 }, s)); };'
            + ' if (map.isStyleLoaded()) go(); else map.once("load", go); })(' + JSON.stringify(sky) + ')');
        } catch (_) {}
      }
      const p = d.getElementById('panel');
      if (p && !d.getElementById('em-foot')) {
        const notes = d.getElementById('notes');
        if (notes) p.appendChild(notes);
        const foot = d.createElement('div');
        foot.id = 'em-foot';
        const st = d.getElementById('stack-toggle'), cr = d.getElementById('credit');
        if (st) foot.appendChild(st);
        if (cr) foot.appendChild(cr);
        p.appendChild(foot);
        const RO = fr.contentWindow.ResizeObserver;
        if (RO) new RO(() => arrange(fr)).observe(p);
      }
      if (fr === frame) document.body.classList.toggle('joined', !!p);
      const div = d.getElementById('divider');
      if (div && !div.querySelector('.em-date')) {
        const ls = [...d.querySelectorAll('.side-label')];
        const before = ls.find((l) => /before/i.test(l.textContent)), after = ls.find((l) => /after/i.test(l.textContent));
        const clean = (l) => l.textContent.replace(/[◂▸◀▶‹›]/g, '').replace(/\s*\((before|after)\)\s*/i, '').trim();
        if (before && after) {
          for (const [l, side, text] of [[before, 'l', '◂ ' + clean(before)], [after, 'r', clean(after) + ' ▸']]) {
            const s = d.createElement('span'); s.className = 'em-date ' + side; s.textContent = text; div.appendChild(s);
          }
        }
      }
      const below = folded || !p ? cardTop - 8 : p.getBoundingClientRect().bottom;
      root.style.setProperty('--em-stack-top', Math.round(below + 8) + 'px');
      let st = d.getElementById('earth-maps-inset');
      if (!st) { st = d.createElement('style'); st.id = 'earth-maps-inset'; d.head.appendChild(st); }
      const right = inset + (float ? float.right + 8 : 0);
      st.textContent = (right ? `.maplibregl-ctrl-top-right, .maplibregl-ctrl-bottom-right { right: ${right}px !important; }
#tl { left: calc(50% - ${right / 2}px) !important; }` : '') + (docked ? '#panel { border-radius: 16px !important; }' : '');
    } catch (_) {}
  }

  // the map you were on comes back after a reload (Dan, 2026-10-31: "on refresh i come back where i was")
  let maps = [], current = decodeURIComponent(location.hash.slice(1)) || localStorage.getItem('earth-maps.current') || null, known = null, frame = null, stamps = null;
  const GLYPH = {
    '3D': '<path d="M3 19l6-10 4 6 3-4 5 8z"/>',
    'Before / after': '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 3v18"/>',
    'Timelapse': '<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
    'Field test': '<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/>',
    'Map': '<path d="M12 4l9 5-9 5-9-5z"/><path d="M3 14l9 5 9-5"/>',
  };
  const thumb = (m) => m.thumb ? `<img src="/maps/${m.thumb}" alt="" loading="lazy">` : `<svg viewBox="0 0 24 24">${GLYPH[m.kind] || GLYPH.Map}</svg>`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function ago(ms) {
    const m = Math.round((Date.now() - ms) / 60000);
    if (m < 60) return m <= 1 ? 'just now' : m + 'm ago';
    const h = Math.round(m / 60);
    return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
  }
  const meta = (m, i) => `<b>${esc(m.kind)}</b> &middot; ${ago(m.mtime)}${i != null ? ' &middot; ' + (i + 1) + ' of ' + maps.length : ''}`;

  function show(file, force) {
    const m = maps.find((x) => x.file === file);
    if (!m) return;
    const same = !force && current === file && frame;
    current = file;
    history.replaceState(null, '', '#' + encodeURIComponent(file));
    try { localStorage.setItem('earth-maps.current', file); } catch (_) {}
    if (!same) {
      // the new map loads underneath and fades in over the old one
      const f = document.createElement('iframe');
      f.title = m.title; f.allow = 'fullscreen';
      f.src = '/maps/' + file + '?fit&theme=' + theme;
      f.onload = () => {
        const old = frame; frame = f;
        // where this map is, from its own box, so it can become a living world
        try { const b = f.contentWindow.eval('typeof BBOX !== "undefined" ? BBOX : null'); if (Array.isArray(b) && b.length === 4) { whereOf[m.file] = [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2]; told = ''; tellParent(); } } catch (_) {}
        // no picture of it yet: snap one once its tiles and trees have drawn
        if (!m.thumb) setTimeout(() => { if (frame === f) snapThumb(f, m.file); }, 6500);
        fitW = f.contentWindow.innerWidth;
        arrange(f);
        // the map draws its own pieces as it starts; join them once they are there
        setTimeout(() => arrange(f), 600);
        setTimeout(() => arrange(f), 1600);
        f.classList.add('on');
        if (old && old !== f) setTimeout(() => old.remove(), 500);
      };
      stage.appendChild(f);
    }
    document.body.classList.remove('open');
    draw();
  }

  function draw() {
    tellParent();
    const i = maps.findIndex((m) => m.file === current), m = maps[i];
    $('picker').hidden = !m;
    if (!m) return;
    $('nowthumb').innerHTML = thumb(m);
    if ($('nowtitle').textContent !== m.title) { $('nowtitle').innerHTML = '<span class="run"></span>'; $('nowtitle').firstChild.textContent = m.title; requestAnimationFrame(() => runTitle(false)); }
    $('nowmeta').innerHTML = meta(m, i);
    $('prev').disabled = i <= 0;
    $('next').disabled = i >= maps.length - 1;
    $('list').innerHTML = maps.map((x) =>
      `<button class="row${x.file === current ? ' cur' : ''}" role="menuitem" data-file="${esc(x.file)}">
         <span class="thumb">${thumb(x)}</span><span class="words"><span class="t">${esc(x.title)}</span><span class="meta">${meta(x)}</span></span>
       </button>`).join('');
  }

  // A snapshot of the map as it looks: the biggest canvas on its page, caught in
  // the frame it was drawn in (a map library repaints on request first), cropped
  // to the card's shape, and kept only if it is not a dark or flat picture.
  function snapThumb(fr, file) {
    let p;
    try {
      p = fr.contentWindow.eval(`new Promise((res) => {
        const grab = () => {
          try {
            const c = [...document.querySelectorAll('canvas')].sort((a, b) => b.width * b.height - a.width * a.height)[0];
            if (!c) return res(null);
            const W = 480, H = 300, t = document.createElement('canvas'); t.width = W; t.height = H;
            const r = Math.max(W / c.width, H / c.height), w = c.width * r, h = c.height * r;
            const x = t.getContext('2d'); x.drawImage(c, (W - w) / 2, (H - h) / 2, w, h);
            const px = x.getImageData(0, 0, W, H).data; let sum = 0, sq = 0, n = 0;
            for (let i = 0; i < px.length; i += 160) { const v = (px[i] + px[i + 1] + px[i + 2]) / 3; sum += v; sq += v * v; n++; }
            const mean = sum / n, sd = Math.sqrt(Math.max(0, sq / n - mean * mean));
            res(mean > 28 && sd > 12 ? t.toDataURL('image/jpeg', 0.84) : null);
          } catch (e) { res(null); }
        };
        if (typeof map !== 'undefined' && map && map.once && map.triggerRepaint) { map.once('render', grab); map.triggerRepaint(); }
        else requestAnimationFrame(grab);
      })`);
    } catch (_) { return; }
    Promise.resolve(p).then((data) => {
      if (!data) return;
      fetch('/api/thumb', { method: 'POST', body: JSON.stringify({ file, data }) }).then(() => load()).catch(() => {});
    });
  }

  const stepBy = (d) => { const i = maps.findIndex((m) => m.file === current); const n = maps[i + d]; if (n) show(n.file); };
  $('prev').onclick = () => stepBy(-1);
  $('next').onclick = () => stepBy(1);
  $('theme').onclick = () => setTheme(theme === 'light' ? 'dark' : 'light');
  $('fold').onclick = () => setFold(!folded);
  $('now').onclick = () => document.body.classList.toggle('open');
  // a clipped name glides left on hover so it can be read, then back
  function runTitle(on) {
    const box = $('nowtitle'), run = box.firstChild; if (!run || !run.getBoundingClientRect) return;
    const over = run.getBoundingClientRect().width - box.clientWidth;
    box.classList.toggle('long', over > 2);
    if (over > 2) { box.style.setProperty('--run-d', -(over + 6) + 'px'); box.style.setProperty('--run-s', Math.max(1, (over + 6) / 45).toFixed(2) + 's'); }
    box.classList.toggle('running', on && over > 2);
  }
  $('now').onmouseenter = () => runTitle(true);
  $('now').onmouseleave = () => runTitle(false);
  $('list').onclick = (e) => { const c = e.target.closest('.row'); if (c) show(c.dataset.file); };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') stepBy(-1);
    else if (e.key === 'ArrowRight') stepBy(1);
    else if (e.key === 'g' || e.key === 'G') document.body.classList.toggle('open');
    else if (e.key === 't' || e.key === 'T') setTheme(theme === 'light' ? 'dark' : 'light');
    else if (e.key === 'f' || e.key === 'F') setFold(!folded);
    else if (e.key === 'Escape') document.body.classList.remove('open');
  });
  // When the view changes size a lot (leaving full screen, dragging the line
  // beside the chat), the map fits its own area again, clear of the card.
  let fitW = 0, fitT = 0;
  function refit(fr) {
    try {
      const w = fr.contentWindow, W = w.innerWidth;
      if (!W || (fitW && Math.abs(W - fitW) / fitW < 0.12)) return;
      fitW = W;
      const card = folded ? 0 : Math.min($('picker').getBoundingClientRect().width + 20, W * 0.4);
      const right = 24 + inset + (float ? Math.min(float.right, W * 0.35) : 0);
      w.eval('(function(l, r){ if (typeof map === "undefined" || typeof BBOX === "undefined") return;'
        + ' map.fitBounds([[BBOX[0], BBOX[1]], [BBOX[2], BBOX[3]]], { padding: { top: ' + Math.round((docked ? insetTop : 0) + 40) + ', bottom: 40, left: l, right: r },'
        + ' pitch: map.getPitch(), bearing: map.getBearing(), duration: 600 }); })(' + Math.round(24 + card) + ', ' + Math.round(right) + ')');
    } catch (_) {}
  }
  function reflow() {
    if (!frame) return;
    arrange(frame);
    clearTimeout(fitT);
    fitT = setTimeout(() => refit(frame), 260);
  }
  window.addEventListener('resize', reflow);

  async function load() {
    try { maps = await (await fetch('/api/maps', { cache: 'no-store' })).json(); } catch { return; }
    if (!maps.length) { stage.innerHTML = '<div class="empty">No maps yet.<br>Ask for one in the chat and it lands here.</div>'; return; }
    const top = maps[0].file;
    // a NEWLY MADE map takes the stage the moment it lands; one that was only
    // rewritten (a world's page redrawn while it is being worked on) does not
    // pull you away from the map you are on (Dan, 2026-10-31)
    const fresh = known ? maps.find((m) => !known.has(m.file)) : null;
    // the map you are on was redrawn: reload it in place (a world keeps your view itself)
    const mine = maps.find((m) => m.file === current);
    const redrawn = mine && stamps && stamps[current] && stamps[current] !== mine.mtime;
    stamps = Object.fromEntries(maps.map((m) => [m.file, m.mtime]));
    if (fresh) show(fresh.file);
    else if (redrawn && frame) show(current, true);
    else if (!current || !maps.some((m) => m.file === current)) show(top);
    else if (!frame) show(current);
    else draw();
    known = new Set(maps.map((m) => m.file));
  }
  // A WORLD'S "Add your own touch" (2026-10-31): the world asks, this page passes it to the
  // chat, worded so the agent studies the place and works inside the touch guidelines
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.type !== 'living-world:add-touch' || !frame || e.source !== frame.contentWindow) return;
    const world = String(d.world || 'this world').slice(0, 80), slug = String(d.slug || '').replace(/[^a-z0-9-]/gi, '').slice(0, 80);
    window.parent.postMessage({ type: 'astrolabe:ask', text: 'Help me add a touch to ' + world + (slug ? ' (' + slug + ')' : '') +
      ': read tools/earth-maps/worlds/touches/TOUCH.md and the touches it already has, look at what would make it most true to life, suggest two or three touches that fit the budget, and make the one I pick.' }, '*');
  });
  paintTheme();
  setFold(folded);
  load();
  setInterval(load, 4000);
</script>
</body>
</html>
