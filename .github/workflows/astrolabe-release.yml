# Astrolabe release on merge. Added by `node dashboard/dev/astrolabify.js`
# from goggledefogger/second-brain-dashboard; the logic is .github/astrolabe/release.js.
#
# A pull request gets one comment saying the version it becomes and the note
# members will read. When it merges, the version goes up everywhere it is
# carried and the note lands in CHANGELOG.md, so the Astrolabe store and
# Claude Code offer the update with no one remembering to.
#
# pull_request_target so pull requests from forks can be commented on and
# released; it only ever checks out this repo's own base branch, never the
# pull request's code.
name: Astrolabe release

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: astrolabe-release-${{ github.event.action == 'closed' && 'main' || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
      - run: node .github/astrolabe/release.js preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
      - id: bump
        run: node .github/astrolabe/release.js release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.bump.outputs.released == 'true'
        env:
          MSG: ${{ steps.bump.outputs.message }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git config user.name "astrolabe-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$MSG"
          for i in 1 2 3; do git pull --rebase origin "$BASE" && git push origin "HEAD:$BASE" && exit 0; sleep 5; done
          exit 1
