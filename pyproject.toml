[project]
name = "living-worlds"
version = "0.2.1"
description = "Walk-in 3D worlds of real places, built from open Earth data: lidar ground and trees, the place's own species and birds, buildings, water and sound, as one HTML file. A companion to Groundstation."
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dan Hahn" }]
dependencies = [
    "mcp>=1.2.0,<2",
    "numpy>=1.26",
    "rio-tiler>=9.4.2",
]

[project.urls]
Repository = "https://github.com/bookbran/living-worlds"
Groundstation = "https://github.com/dannybauman/groundstation"

[project.scripts]
living-worlds = "living_worlds.server:main"
living-worlds-maps = "living_worlds.viewer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/living_worlds"]
